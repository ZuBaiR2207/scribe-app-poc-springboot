spring.application.name=scribe-app-poc

# Storage: Spring Data JPA with H2 in file mode (./data/scribe).
# Using ddl-auto=update for this POC (Flyway migrations can be introduced in production)
spring.datasource.url=jdbc:h2:file:./data/scribe;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session limits & allowed languages
app.limits.max-transcript-length=50000
app.allowed-languages=cmn_en_ms_ta,en_ms,cmn_en,en_ta,en,ms

# Speechmatics & LLM properties
speechmatics.api-key=${SPEECHMATICS_API_KEY:}
llm.base-url=https://generativelanguage.googleapis.com/v1beta/openai
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-2.5-flash

llm.base-url=https://generativelanguage.googleapis.com/v1beta/openai
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-2.5-flash