spring.application.name=scribe-app-poc-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.limits.max-transcript-length=50000
app.allowed-languages=cmn_en_ms_ta,en_ms,cmn_en,en_ta,en,ms

speechmatics.api-key=test-sm-key
llm.base-url=https://generativelanguage.googleapis.com/v1beta/openai
llm.api-key=test-llm-key
llm.model=gemini-2.5-flash
